<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cart — Workshop Wovens</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header>
    <a href="index.html" class="logo">Workshop Wovens</a>
    <button class="hamburger" aria-label="Open menu" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
    <nav>
      <a href="index.html">Home</a>
      <a href="shop.html">Shop</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
      <a href="https://www.instagram.com/workshop_wovens/?r=nametag" target="_blank" rel="noopener">Instagram</a>
      <a href="cart.html" class="nav-cart">Cart (0)</a>
    </nav>
  </header>

  <main>
    <div class="cart-page">
      <h1>Your cart</h1>

      <div class="cart-header-row">
        <span></span>
        <span>Item</span>
        <span>Quantity</span>
        <span style="text-align:right">Price</span>
        <span></span>
      </div>

      <div id="cart-items"></div>

      <div id="cart-summary" class="cart-summary" style="display:none">
        <div class="cart-total-row">
          <span class="cart-total-label">Total</span>
          <strong id="cart-total-price">£0.00</strong>
        </div>
        <a href="contact.html" class="btn-checkout">Contact to order</a>
        <p class="cart-note">Each cushion is one-of-a-kind. Get in touch with Roz to confirm availability and arrange payment.</p>
      </div>
    </div>
  </main>

  <footer>
    <a href="shop.html">Shop</a>
    <a href="about.html">About</a>
  </footer>

  <script src="js/cart.js"></script>
  <script src="js/carousel.js"></script>
</body>
</html>
